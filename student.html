  <!-- Firebase -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDtyyxxeUvmjon7tivpS1Kga2GdXlnCAQ4",

      authDomain:
        "mostaqbal-academy-5f51b.firebaseapp.com",

      databaseURL:
        "https://mostaqbal-academy-5f51b-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "mostaqbal-academy-5f51b",

      storageBucket:
        "mostaqbal-academy-5f51b.firebasestorage.app",

      messagingSenderId:
        "398450175799",

      appId:
        "1:398450175799:web:83a302dac12387bc3234b2"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    onAuthStateChanged(auth, (user) => {

      if (!user) {

        window.location.href = "index.html";

        return;
      }


      const phone =
        user.phoneNumber || "غير متوفر";


      document.getElementById("studentPhone")
        .textContent = phone;

      document.getElementById("infoPhone")
        .textContent = phone;


      const name = "الطالب";


      document.getElementById("studentName")
        .textContent = name;

      document.getElementById("infoName")
        .textContent = name;

      document.getElementById("miniName")
        .textContent = name;


      document.getElementById("avatar")
        .textContent = name.charAt(0);

      document.getElementById("miniAvatar")
        .textContent = name.charAt(0);

    });


    window.logout = async function () {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

        alert("حدث خطأ أثناء تسجيل الخروج");

      }

    };


    window.goHome = function () {

      window.location.href = "index.html";

    };


    const progress = 0;

    document.getElementById("progressBar")
      .style.width = progress + "%";

    document.getElementById("progressPercent")
      .textContent = progress + "%";


    function openMenu() {

      document.getElementById("sidebar")
        .classList.add("open");

      document.getElementById("overlay")
        .classList.add("show");

    }

    function closeMenu() {

      document.getElementById("sidebar")
        .classList.remove("open");

      document.getElementById("overlay")
        .classList.remove("show");

    }

    window.openMenu = openMenu;
    window.closeMenu = closeMenu;

  </script>
